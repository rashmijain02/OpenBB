# Synthetic Hermes config trimmed from cli-config.yaml.example (MIT, (c) 2025 Nous Research)
# Source: rashmijain02/hermes-agent main @ 710fa8a073f9a8136e10749b083a16779341faef
# Only the keys the route and skill readers consume are kept. No real values.
# Finance-safe: explicit loopback gateway, private alias, no fallbacks, no adoption,
# every auxiliary task bound to the gateway (#1338),
# no skill writers (curator, background review, skill_manage) and no extra skill roots.
model:
  default: "finance-private"
  provider: "custom"
  base_url: "http://127.0.0.1:4000/v1"
  api_key: "SYNTHETIC-GATEWAY-KEY-SENTINEL"
fallback_providers: []
delegation:
  fallback_providers: []
auxiliary:
  approval:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  background_review:
    enabled: false
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  compression:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  curator:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  goal_judge:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  kanban_decomposer:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  mcp:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  memory_query_rewrite:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  moa_aggregator:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  moa_reference:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  monitor:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  profile_describer:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  review:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  skills_hub:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  title_generation:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  triage_specifier:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  tts_audio_tags:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  vision:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
  voice_chat:
    provider: "custom"
    base_url: "http://127.0.0.1:4000/v1"
agent:
  disabled_toolsets: [skills]
skills:
  external_dirs: []
  create_dir: ""
  project_discovery: false
  inline_shell: false
curator:
  enabled: false
auth:
  adopt_external_logins: false
memory:
  memory_enabled: false
  user_profile_enabled: false
telemetry:
  shared_metrics:
    enabled: false
