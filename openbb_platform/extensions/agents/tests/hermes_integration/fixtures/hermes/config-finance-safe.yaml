# Only the keys the route reader consumes are kept. No real values.
# Finance-safe: explicit loopback gateway, private alias, no fallbacks, no adoption,
# and every auxiliary task of the pinned DEFAULT_CONFIG bound to the gateway (#1338).
model:
  default: "finance-private"
  provider: "custom"
  base_url: "http://127.0.0.1:4000/v1"
  api_key: "SYNTHETIC-GATEWAY-KEY-SENTINEL"
fallback_providers: []
delegation:
  fallback_providers: []
