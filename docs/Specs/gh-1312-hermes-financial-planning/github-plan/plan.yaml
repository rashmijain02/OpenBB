  - id: HFP-P01
    kind: pbi
    parent: HFP-F01
    title: Qualify native runtime provenance and connection health
    outcome: Owner can distinguish configured authenticated admitted callable and qualified services before use.
    requirements: [PF-20, PF-26]
    primary_for: [PF-20, PF-26]
    source_refs: [SPEC#11, PLAN#12, RESEARCH#9]
    depends_on: [G1, SOURCES-PINNED]
    acceptance: ["Given the selected native runtime and local aliases, health reports exact process and module provenance without secret values.", "Given a stopped model, wrong database or incompatible ABI, admission blocks and reports the failed layer instead of installing or falling back."]
    tasks: [{"id": "HFP-P01-T01", "title": "Implement metadata-only provenance checks with wrong-origin and wrong-database regression cases."}, {"id": "HFP-P01-T02", "title": "Qualify the selected Hermes/WebUI and provider handshake matrix with unavailable-service outcomes."}, {"id": "HFP-P01-T03", "title": "Bind existing LiteLLM aliases to verified local backends and prove refused-backend behavior with synthetic sentinels."}]
    verification: Run the real native health/preflight path against a synthetic profile and denied backend; record versions and failure states.
    estimate: {size: L, rationale: Multiple native processes and independent package origins require real-path qualification}
  - id: HFP-P02
    kind: pbi
    parent: HFP-F01
    title: Enforce private data and immutable skill boundaries
    outcome: Raw household facts stay in authorized services while Hermes receives only reviewed evidence projections.
    requirements: [PF-18, PF-26]
    primary_for: [PF-18]
    source_refs: [SPEC#4.8, PLAN#4, PLAN#12]
    depends_on: [HFP-P01, PRIVATE-APPROVAL]
    acceptance: ["Given private-shaped sentinels, model logs callbacks memory and provider requests contain no raw values.", "Given unauthorized artifact fields, writable runtime skills or a hosted fallback route, the request fails closed."]
    tasks: [{"id": "HFP-P02-T01", "title": "Implement principal and operation-scoped access capabilities with default-deny tests."}, {"id": "HFP-P02-T02", "title": "Enforce read-only admitted skills and quarantined proposals using synthetic write-denial cases."}, {"id": "HFP-P02-T03", "title": "Qualify field-level evidence projections and local-only routing under inference logging and fallback failures."}]
    verification: Exercise denied routes and artifact reads through the actual policy boundary using synthetic private-shaped data.
    estimate: {size: L, rationale: Cross-process authorization and inference-risk controls must agree}
